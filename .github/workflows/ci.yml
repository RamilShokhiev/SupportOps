name: Verify SupportOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: supportops_test
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SUPPORTOPS_TEST_DATABASE_URL: postgresql+psycopg://supportops:test-only@127.0.0.1:5432/supportops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/evaluate.py --split test
      - run: python scripts/evaluate_review_team.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-evaluation
          path: data/evaluation/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install httpx==0.28.1
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8001/health
      - run: python scripts/smoke.py
      - run: python scripts/smoke.py --workflow-mode multi_agent_review
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
